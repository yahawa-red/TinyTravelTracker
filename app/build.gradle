apply plugin: 'com.android.application'

android {
    namespace 'com.rareventure.gps2'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.rareventure.gps2"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 91
        versionName "1.1.48"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'

    implementation 'ch.acra:acra:4.9.1'
  
    implementation 'com.github.tangrams.tangram-android:tangram:0.10.1'
    implementation 'com.github.tajchert:nammu:1.2.0'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.5'
}
